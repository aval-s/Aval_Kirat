		<div id="fh5co-started" style="background-image:url(images/bg_2.png);" data-stellar-background-ratio="0.5">
			<div class="overlay"></div>
			<div class="container">
				<div class="row animate-box">
					<div class="col-md-8 col-md-offset-2 text-center heading-section">
						<h2>Will you join us?</h2>
						<!---p>Please Fill-up the form to notify you that you're attending. Thanks.--</p-->
					</div>
				</div>
				<div class="row animate-box">
					<div class="col-md-10 col-md-offset-1">
						<!-- Paste the form here -->
						<form id="rsvp-form" class="rsvp-form" action="https://formspree.io/f/mpwpwlog" method="POST">
							<input type="hidden" name="side" value="Bride's side">
							<input type="hidden" name="_subject" value="New RSVP (Bride's side)">
							<input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none">
							<div class="row">
								<div class="col-sm-6"><div class="form-group">
									<label for="rsvp-name" class="sr-only">Name</label>
									<input type="text" class="form-control" id="rsvp-name" name="name" placeholder="Your name" required>
								</div></div>
								<div class="col-sm-6"><div class="form-group">
									<label for="rsvp-email" class="sr-only">Email</label>
									<input type="email" class="form-control" id="rsvp-email" name="email" placeholder="Email" required>
								</div></div>
							</div>
							<div class="rsvp-choice">
								<label class="rsvp-pill"><input type="radio" name="attending" value="Yes" required><span>Joyfully accepts</span></label>
								<label class="rsvp-pill"><input type="radio" name="attending" value="No"><span>Regretfully declines</span></label>
							</div>
							<div id="rsvp-extra">
								<p class="rsvp-label">How many people are coming, including you?</p>
								<div class="form-group">
									<select class="form-control" name="guests" aria-label="Number of guests">
									<option value="1">1 (just me)</option>
									<option value="2">2</option>
									<option value="3">3</option>
									<option value="4">4</option>
									<option value="5">5</option>
									<option value="6">6</option>
									<option value="7">7</option>
									<option value="8">8</option>
									</select>
								</div>
								<p class="rsvp-label">Which events will you join?</p>
								<div class="rsvp-grid">
								<label class="rsvp-pill"><input type="checkbox" name="event" value="Patth Arambh"><span>Patth Arambh</span></label>
								<label class="rsvp-pill"><input type="checkbox" name="event" value="Patth da Bhog"><span>Patth da Bhog</span></label>
								<label class="rsvp-pill"><input type="checkbox" name="event" value="Haldi"><span>Haldi</span></label>
								<label class="rsvp-pill"><input type="checkbox" name="event" value="Mehndi"><span>Mehndi</span></label>
								<label class="rsvp-pill"><input type="checkbox" name="event" value="Jaggo / Sangeet Night"><span>Jaggo / Sangeet Night</span></label>
								<label class="rsvp-pill"><input type="checkbox" name="event" value="Anand Karaj"><span>Anand Karaj</span></label>
								<label class="rsvp-pill"><input type="checkbox" name="event" value="Reception"><span>Reception</span></label>
								</div>
							</div>
							<div class="form-group">
								<label for="rsvp-message" class="sr-only">Message</label>
								<textarea class="form-control" id="rsvp-message" name="message" rows="3" placeholder="A note for us (optional)"></textarea>
							</div>
							<button type="submit" class="btn btn-primary btn-block">Send RSVP</button>
							<p id="rsvp-status" class="rsvp-status" role="status"></p>
						</form>
					</div>
